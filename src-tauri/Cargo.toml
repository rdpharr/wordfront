[package]
name = "wordfront"
version = "0.1.0"
description = "Wordfront: an arcade typing shooter"
license = "MIT"
repository = "https://github.com/rdpharr/wordfront"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
