name: Release

# Push a tag like v0.2.0 (matching package.json) to build every installer into a draft
# GitHub Release; check it, then publish it, which also deploys the web version (pages.yml).
# Run it by hand (Actions > Release > Run workflow) to build the installers without
# releasing anything: they're kept as the run's artifacts.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # One draft release up front: the four builds then all upload to it. Left to themselves,
  # parallel builds can each decide no release exists yet and create duplicates.
  create-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - name: The tag matches package.json
        run: |
          want="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json ($want). Run npm version first."
            exit 1
          fi

      - name: Draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # one call that returns the id: listing releases right after creating one can miss it
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$GITHUB_REF_NAME" -f name="Wordfront $GITHUB_REF_NAME" \
            -F draft=true -F body=@.github/release-notes.md --jq .id)
          test -n "$id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.name }})
    needs: create-release
    # also runs when create-release is skipped (a manual run)
    if: ${{ !cancelled() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            runner: windows-latest
            args: ""
          - name: macos-apple-silicon
            runner: macos-latest
            args: --target aarch64-apple-darwin
          - name: macos-intel
            runner: macos-latest
            args: --target x86_64-apple-darwin
          - name: linux
            runner: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          # the AppImage bundles these (bundleMediaFramework): the webview plays sound through
          # GStreamer, and without them the AppImage is silent on machines that lack them
          sudo apt-get install -y gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-pulseaudio

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.name }}

      - run: npm ci
      - run: npm run version:check
      - run: npm test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # signs the update bundles; the public half is in tauri.conf.json
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: npx tauri
          args: ${{ matrix.args }}
          # a manual run has no release: build only
          releaseId: ${{ needs.create-release.outputs.id }}
          # written once by the updater-manifest job instead
          includeUpdaterJson: false

      - name: Keep the installers (manual run)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: wordfront-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/
            src-tauri/target/*/release/bundle/
          if-no-files-found: error

  # latest.json, which installed copies read to find the update, written once from every
  # build's signature (tools/updater_manifest.ts).
  updater-manifest:
    needs: [create-release, build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir sigs
          gh release download "$GITHUB_REF_NAME" --pattern '*.sig' --dir sigs
          npx tsx tools/updater_manifest.ts sigs "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" > latest.json
          cat latest.json
          gh release upload "$GITHUB_REF_NAME" latest.json --clobber
