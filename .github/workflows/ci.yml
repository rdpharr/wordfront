name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Linux libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci
      - name: Versions match (package.json, Cargo.toml, Cargo.lock)
        run: npm run version:check
      - run: npm run typecheck
      - run: npm test
      - name: Build the game (the Rust shell embeds dist/)
        run: npm run build
      - name: Build the web version as GitHub Pages serves it
        run: npx vite build --outDir dist-pages
        env:
          WF_BASE: /wordfront/
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test
