name: Web version

# Deploys the web version to https://rdpharr.github.io/wordfront/ when a release is
# published, so the web and offline versions match. Can also be run by hand.
#
# One-time setup: Pages source = GitHub Actions, and the github-pages environment must
# allow tags: it only allows the default branch at first, and a release run's ref is
# its tag (refs/tags/vX.Y.Z). Add a deployment tag rule `v*` under Settings > Environments.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          WF_BASE: /wordfront/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
